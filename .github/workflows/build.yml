name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /srv/homework-review

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      GHCR_USER: ${{ vars.GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload compose files
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml docker-compose.prod.yml Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:${{ env.DEPLOY_PATH }}/"

      - name: Write server .env
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          APP_URL: ${{ vars.APP_URL }}
          PUBLIC_BACKEND_ORIGIN: ${{ vars.PUBLIC_BACKEND_ORIGIN }}
          PUBLIC_WS_BASE: ${{ vars.PUBLIC_WS_BASE }}
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          INVITE_TTL_DAYS: ${{ vars.INVITE_TTL_DAYS }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          YANDEX_REDIRECT_URI: ${{ vars.YANDEX_REDIRECT_URI }}
        run: |
          {
            printf 'DOMAIN=%s\n' "${DOMAIN:-}"
            printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER:-app}"
            printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD:-app}"
            printf 'POSTGRES_DB=%s\n' "${POSTGRES_DB:-app}"
            printf 'BACKEND_PORT=%s\n' "${BACKEND_PORT:-3001}"
            printf 'FRONTEND_PORT=%s\n' "${FRONTEND_PORT:-3000}"
            printf 'APP_URL=%s\n' "${APP_URL:-https://$DOMAIN}"
            printf 'PUBLIC_BACKEND_ORIGIN=%s\n' "${PUBLIC_BACKEND_ORIGIN:-https://$DOMAIN}"
            printf 'PUBLIC_WS_BASE=%s\n' "${PUBLIC_WS_BASE:-wss://$DOMAIN}"
            printf 'SESSION_TTL_DAYS=%s\n' "${SESSION_TTL_DAYS:-30}"
            printf 'INVITE_TTL_DAYS=%s\n' "${INVITE_TTL_DAYS:-7}"
            printf 'COOKIE_SECURE=%s\n' "${COOKIE_SECURE:-true}"
            printf 'YANDEX_CLIENT_ID=%s\n' "${YANDEX_CLIENT_ID:-}"
            printf 'YANDEX_CLIENT_SECRET=%s\n' "${YANDEX_CLIENT_SECRET:-}"
            printf 'YANDEX_REDIRECT_URI=%s\n' "${YANDEX_REDIRECT_URI:-https://$DOMAIN/api/auth/yandex/callback}"
          } | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > ${{ env.DEPLOY_PATH }}/.env"

      - name: Pull and start
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd ${{ env.DEPLOY_PATH }}
            if [ -n '$GHCR_TOKEN' ]; then
              echo '$GHCR_TOKEN' | docker login ${{ env.REGISTRY }} -u '$GHCR_USER' --password-stdin
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
          "
